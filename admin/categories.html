<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Krishna Jewellers | Categories</title>


<style>

:root {
    --gold: #d4af37;
    --gold2: #a77b09;
    --dark: #090909;
    --cream: #fbf8f0;
    --red: #b42318;
}


* {
    box-sizing: border-box;
}


body {

    margin: 0;

    background:
        linear-gradient(
            135deg,
            #f8f3e6,
            #fff
        );

    font-family: Arial, sans-serif;

    color: #222;

}


button,
input {

    font-family: inherit;

}


button {

    cursor: pointer;

}


/* =====================================================
   HEADER
===================================================== */

.top {

    background: #090909;

    color: white;

    padding: 22px 5%;

    display: flex;

    justify-content: space-between;

    align-items: center;

    border-bottom:
        1px solid
        rgba(212,175,55,.3);

}


.top h1 {

    margin: 0;

    color: var(--gold);

    font:
        700 28px
        Georgia,
        serif;

}


.top a {

    color: white;

    text-decoration: none;

    border:
        1px solid
        #555;

    padding:
        9px 14px;

    border-radius: 8px;

}


/* =====================================================
   MAIN
===================================================== */

.wrap {

    max-width: 1100px;

    margin:
        28px auto;

    padding:
        0 18px;

}


.card {

    background: white;

    border:
        1px solid
        #ead9a3;

    border-radius: 18px;

    padding: 24px;

    box-shadow:
        0 10px 28px
        rgba(0,0,0,.05);

    margin-bottom: 22px;

}


h2 {

    margin: 0;

    color:
        var(--gold2);

    font:
        700 25px
        Georgia,
        serif;

}


.sub {

    color: #777;

    margin-top: 7px;

}


/* =====================================================
   ADD CATEGORY
===================================================== */

.form-grid {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 14px;

}


.field label {

    display: block;

    font-weight: 700;

    margin-bottom: 7px;

}


.field input {

    width: 100%;

    padding: 12px;

    border:
        1px solid
        #ccc;

    border-radius: 8px;

    font-size: 15px;

}


.upload {

    margin-top: 15px;

    border:
        2px dashed
        var(--gold);

    padding: 18px;

    text-align: center;

    border-radius: 13px;

    background: #fffdf7;

}


.upload input {

    display: block;

    margin:
        12px auto 0;

}


.btn {

    border: 0;

    background:
        linear-gradient(
            135deg,
            var(--gold),
            var(--gold2)
        );

    color: white;

    padding:
        11px 18px;

    border-radius: 8px;

    font-weight: 700;

    margin-top: 14px;

}


.secondary {

    background: #444;

}


.danger {

    background:
        var(--red);

}


.btn:hover {

    transform:
        translateY(-1px);

}


/* =====================================================
   STATUS
===================================================== */

.status {

    display: none;

    margin-top: 12px;

    padding: 10px;

    border-radius: 8px;

}


.success {

    display: block;

    background:
        #e9f7ec;

    color:
        #28733a;

}


.error {

    display: block;

    background:
        #ffeded;

    color:
        #a32920;

}


/* =====================================================
   SEARCH
===================================================== */

.search {

    margin-top: 20px;

}


.search input {

    width: 100%;

    padding: 14px;

    border:
        2px solid
        #ead9a3;

    border-radius: 9px;

    font-size: 16px;

    outline: none;

}


.search input:focus {

    border-color:
        var(--gold);

}


/* =====================================================
   CATEGORY GRID
===================================================== */

.grid {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 16px;

    margin-top: 22px;

}


.category {

    background: white;

    border:
        1px solid
        #ead9a3;

    border-radius: 14px;

    overflow: hidden;

}


.category-image {

    width: 100%;

    height: 190px;

    object-fit: cover;

    display: block;

}


.no-image {

    width: 100%;

    height: 190px;

    display: grid;

    place-items: center;

    background:
        var(--cream);

    color: #999;

}


.category-body {

    padding: 14px;

}


.category-body h3 {

    margin:
        0 0 12px;

    color:
        var(--gold2);

    font-size: 19px;

}


.actions {

    display: flex;

    gap: 7px;

    flex-wrap: wrap;

}


.actions .btn {

    margin-top: 0;

    font-size: 13px;

}


/* =====================================================
   EMPTY
===================================================== */

.empty {

    text-align: center;

    padding: 30px;

    color: #888;

    background:
        #fafafa;

    border-radius: 12px;

    grid-column:
        1 / -1;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width: 700px) {


    .top {

        flex-direction:
            column;

        gap: 12px;

        text-align:
            center;

    }


    .top h1 {

        font-size: 25px;

    }


    .wrap {

        padding:
            0 12px;

    }


    .card {

        padding: 18px;

    }


    .form-grid {

        grid-template-columns:
            1fr;

    }


    .grid {

        grid-template-columns:
            1fr;

    }


    .category-image,
    .no-image {

        height: 220px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="top">

    <h1>
        Category Management
    </h1>


    <a href="/admin/logout" style="margin-left:8px;">Logout</a>


    <a href="index.html">

        ← Back to Admin

    </a>

</header>



<main class="wrap">


<!-- =====================================================
     ADD CATEGORY
===================================================== -->

<section class="card">


    <h2>
        Add New Category
    </h2>


    <p class="sub">

        Create a new jewellery category
        with its display photo.

    </p>



    <form id="categoryForm">


        <div class="form-grid">


            <div class="field">

                <label>
                    Category Name
                </label>


                <input
                    type="text"
                    id="categoryName"
                    placeholder="Example: Earrings"
                    required>

            </div>



            <div class="field">

                <label>
                    Category Photo
                </label>


                <input
                    type="file"
                    id="categoryPhotoPicker"
                    accept="
                        image/jpeg,
                        image/png,
                        image/webp
                    "
                    required>

            </div>


        </div>



        <div class="upload">

            JPG, PNG or WEBP

            <br>

            Maximum 8MB

        </div>



        <button
            type="submit"
            class="btn"
            id="addCategoryBtn">

            Add Category

        </button>


    </form>



    <div
        id="categoryStatus"
        class="status">

    </div>


</section>



<!-- =====================================================
     ALL CATEGORIES
===================================================== -->

<section class="card">


    <h2>
        All Categories
    </h2>


    <p class="sub">

        Manage all your jewellery categories
        from here.

    </p>



    <!-- SEARCH -->

    <div class="search">

        <input
            type="search"
            id="categorySearch"
            placeholder="🔍 Search category...">

    </div>



    <!-- CATEGORY LIST -->

    <div
        id="categoryList"
        class="grid">

    </div>


</section>


</main>



<script>

/* =====================================================
   HELPER
===================================================== */

const $ =
    id =>
        document.getElementById(id);



/* =====================================================
   ESCAPE HTML
===================================================== */

function esc(value) {

    return String(
        value ?? ""
    ).replace(
        /[&<>"']/g,
        function(match) {

            return {

                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"

            }[match];

        }
    );

}



/* =====================================================
   STATUS
===================================================== */

function status(
    message,
    type
) {

    $("categoryStatus").textContent =
        message;


    $("categoryStatus").className =
        "status " + type;

}



/* =====================================================
   CATEGORY DATA
===================================================== */

let allCategories = [];



/* =====================================================
   LOAD CATEGORIES
===================================================== */

async function loadCategories() {

    try {

        const response =
            await fetch(
                "/api/categories?_=" + Date.now(),
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Could not load categories."
            );

        }


        const data =
            await response.json();


        allCategories =
            Array.isArray(
                data.categories
            )
                ? data.categories
                : [];


        renderCategories();


    } catch (error) {

        console.error(
            "Category load error:",
            error
        );


        $("categoryList").innerHTML = `

            <div class="empty">

                Could not load categories.

            </div>

        `;

    }

}


/* =====================================================
   RENDER CATEGORIES
===================================================== */

function renderCategories() {


    const search =
        $("categorySearch")
            .value
            .toLowerCase()
            .trim();



    const filtered =
        allCategories.filter(
            category => {


                const name =
                    typeof category === "string"

                        ? category

                        : category?.name || "";


                return name
                    .toLowerCase()
                    .includes(search);

            }
        );



    if (
        filtered.length === 0
    ) {

        $("categoryList").innerHTML = `

            <div class="empty">

                ${
                    search

                        ? "No categories found."

                        : "No categories added yet."

                }

            </div>

        `;

        return;

    }



    $("categoryList").innerHTML =
        filtered.map(
            category => {


                const name =
                    typeof category === "string"

                        ? category

                        : category?.name;



                const image =
    typeof category === "object" &&
    category?.image

        ? "/" +
          category.image +
          "?v=" +
          Date.now()

        : "";



                return `

                    <article
                        class="category">


                        ${
                            image

                                ?

                                `

                                <img
                                    class="category-image"
                                    src="${esc(image)}"
                                    alt="${esc(name)}">

                                `

                                :

                                `

                                <div
                                    class="no-image">

                                    No Photo

                                </div>

                                `

                        }



                        <div
                            class="category-body">


                            <h3>

                                ${esc(name)}

                            </h3>



                            <div
                                class="actions">


                                <!-- CHANGE PHOTO -->

                                <button
                                    type="button"
                                    class="btn"
                                    onclick="
                                        changeCategoryPhoto(
                                            '${encodeURIComponent(name)}'
                                        )
                                    ">

                                    📷 Change Photo

                                </button>



                                <!-- RENAME -->

                                <button
                                    type="button"
                                    class="
                                        btn
                                        secondary
                                    "
                                    onclick="
                                        renameCategory(
                                            '${encodeURIComponent(name)}'
                                        )
                                    ">

                                    Rename

                                </button>



                                <!-- DELETE -->

                                <button
                                    type="button"
                                    class="
                                        btn
                                        danger
                                    "
                                    onclick="
                                        deleteCategory(
                                            '${encodeURIComponent(name)}'
                                        )
                                    ">

                                    Delete

                                </button>


                            </div>


                        </div>


                    </article>

                `;

            }
        ).join("");

}



/* =====================================================
   SEARCH
===================================================== */

$("categorySearch").addEventListener(
    "input",
    renderCategories
);



/* =====================================================
   ADD CATEGORY
===================================================== */

$("categoryForm").onsubmit =
async function(event) {


    event.preventDefault();



    const name =
        $("categoryName")
            .value
            .trim();



    const file =
        $("categoryPhotoPicker")
            .files[0];



    if (!name) {

        status(
            "Please enter category name.",
            "error"
        );

        return;

    }



    if (!file) {

        status(
            "Please select a category photo.",
            "error"
        );

        return;

    }



    const validTypes = [

        "image/jpeg",
        "image/png",
        "image/webp"

    ];



    if (
        !validTypes.includes(
            file.type
        )
    ) {

        status(
            "Only JPG, PNG and WEBP images are allowed.",
            "error"
        );

        return;

    }



    if (
        file.size >
        8 * 1024 * 1024
    ) {

        status(
            "Category photo must be smaller than 8MB.",
            "error"
        );

        return;

    }



    const button =
        $("addCategoryBtn");



    button.disabled =
        true;


    button.textContent =
        "Uploading...";



    try {


        const formData =
            new FormData();



        formData.append(
            "name",
            name
        );


        formData.append(
            "image",
            file
        );



        const response =
            await fetch(
                "/api/categories",
                {

                    method: "POST",

                    body:
                        formData

                }
            );



        const data =
            await response.json();



        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "Could not add category."
            );

        }



        status(
            "Category added successfully.",
            "success"
        );



        $("categoryForm").reset();



        await loadCategories();



    } catch (error) {


        console.error(
            "Add category error:",
            error
        );


        status(
            error.message ||
            "Could not add category.",
            "error"
        );


    } finally {


        button.disabled =
            false;


        button.textContent =
            "Add Category";

    }

};



/* =====================================================
   CHANGE CATEGORY PHOTO
===================================================== */

async function changeCategoryPhoto(
    encodedName
) {

    const name =
        decodeURIComponent(
            encodedName
        );


    const picker =
        document.createElement(
            "input"
        );


    picker.type =
        "file";


    picker.accept =
        "image/jpeg,image/png,image/webp";


    picker.style.display =
        "none";


    document.body.appendChild(
        picker
    );


    /* =================================================
       FILE SELECT EVENT
       IMPORTANT:
       Event listener click se PEHLE lagaya gaya hai.
    ================================================= */

    picker.addEventListener(
        "change",
        async function() {

            const file =
                picker.files &&
                picker.files[0];


            if (!file) {

                picker.remove();

                return;

            }


            /* =================================================
               FILE TYPE
            ================================================= */

            const validTypes = [

                "image/jpeg",
                "image/png",
                "image/webp"

            ];


            if (
                !validTypes.includes(
                    file.type
                )
            ) {

                status(
                    "Only JPG, PNG and WEBP images are allowed.",
                    "error"
                );


                picker.remove();

                return;

            }


            /* =================================================
               FILE SIZE
            ================================================= */

            if (
                file.size >
                8 * 1024 * 1024
            ) {

                status(
                    "Category photo must be smaller than 8MB.",
                    "error"
                );


                picker.remove();

                return;

            }


            try {

                status(
                    "Changing category photo...",
                    "success"
                );


                /* =================================================
                   FORM DATA
                ================================================= */

                const formData =
                    new FormData();


                formData.append(
                    "image",
                    file
                );


                /* =================================================
                   API
                ================================================= */

                const response =
                    await fetch(
                        "/api/categories/" +
                        encodeURIComponent(
                            name
                        ) +
                        "/image",
                        {

                            method: "PUT",

                            body:
                                formData,

                            cache:
                                "no-store"

                        }
                    );


                const data =
                    await response.json();


                /* =================================================
                   ERROR
                ================================================= */

                if (
                    !response.ok ||
                    !data.success
                ) {

                    throw new Error(
                        data.message ||
                        "Could not change category photo."
                    );

                }


                /* =================================================
                   SUCCESS
                ================================================= */

                status(
                    "Category photo changed successfully.",
                    "success"
                );


                /* =================================================
                   IMPORTANT
                   GET FRESH CATEGORY DATA
                ================================================= */

                await loadCategories();


            } catch (error) {

                console.error(
                    "Change category photo error:",
                    error
                );


                status(
                    error.message ||
                    "Could not change category photo.",
                    "error"
                );

            }


            picker.remove();

        }
    );


    /* =================================================
       OPEN FILE PICKER
    ================================================= */

    picker.click();

}


/* =====================================================
   RENAME CATEGORY
===================================================== */

async function renameCategory(
    encodedName
) {


    const oldName =
        decodeURIComponent(
            encodedName
        );



    const newName =
        prompt(
            "Enter new category name:",
            oldName
        );



    if (
        !newName ||
        !newName.trim()
    ) {

        return;

    }



    try {


        const response =
            await fetch(
                "/api/categories/" +
                encodeURIComponent(
                    oldName
                ),
                {

                    method: "PUT",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            newName:
                                newName.trim()

                        })

                }
            );



        const data =
            await response.json();



        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "Could not rename category."
            );

        }



        status(
            "Category renamed successfully.",
            "success"
        );



        loadCategories();



    } catch (error) {


        console.error(
            "Rename category error:",
            error
        );


        status(
            error.message ||
            "Could not rename category.",
            "error"
        );

    }

}



/* =====================================================
   DELETE CATEGORY
===================================================== */

async function deleteCategory(
    encodedName
) {


    const name =
        decodeURIComponent(
            encodedName
        );



    const confirmed =
        confirm(
            `Delete category "${name}"?`
        );



    if (!confirmed) {

        return;

    }



    try {


        const response =
            await fetch(
                "/api/categories/" +
                encodeURIComponent(
                    name
                ),
                {

                    method:
                        "DELETE"

                }
            );



        const data =
            await response.json();



        status(
            data.message ||
            (
                data.success
                    ? "Category deleted."
                    : "Could not delete category."
            ),
            data.success
                ? "success"
                : "error"
        );



        if (
            data.success
        ) {

            loadCategories();

        }



    } catch (error) {


        console.error(
            "Delete category error:",
            error
        );


        status(
            "Could not delete category.",
            "error"
        );

    }

}



/* =====================================================
   START
===================================================== */

loadCategories();

</script>


</body>

</html>
